[package]
name = "axmusic"
version = "0.1.0"
description = "AxMusic — local music player with library management"
authors = ["AxMusic"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "axmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
symphonia = { version = "0.5", default-features = false, features = [
  "flac",
  "mp3",
  "aac",
  "alac",
  "isomp4",
  "pcm",
  "vorbis",
  "ogg",
  "wav",
  "mkv",
  "adpcm",
] }
cpal = "0.15"
ringbuf = "0.4"
crossbeam-channel = "0.5"
walkdir = "2"

[profile.release]
opt-level = 1          # 默认 3,降到 1 编译快一倍+,exe 稍大几 MB 但运行无感
lto = false            # 默认 "thin",关掉省大量链接时间
codegen-units = 16     # 保持并行编译
strip = true           # 去调试符号,减小 exe 体积
