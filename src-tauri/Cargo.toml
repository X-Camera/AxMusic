[package]
name = "axmusic"
version = "0.0.3"
description = "AxMusic — local music player with library management"
authors = ["AxMusic"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "axmusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
symphonia = { version = "0.6.1", default-features = false, features = [
  "flac",
  "mp3",
  "aac",
  "alac",
  "isomp4",
  "pcm",
  "vorbis",
  "ogg",
  "wav",
  "aiff",
  "caf",
  "mkv",
  "adpcm",
] }
cpal = "0.15"
ringbuf = "0.4"
crossbeam-channel = "0.5"
walkdir = "2"
base64 = "0.22"
# GBK/GB18030 歌词与歌单文件回退解码（Windows 中文环境常见；reqwest 已传递依赖）
encoding_rs = "0.8"
# 内嵌封面缩略图（管理表）：仅 jpeg/png 解码 + 缩放，保持编译轻量
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustfft = "6"
# EBU R128 响度分析（扫描估算 ReplayGain）
ebur128 = "0.1"
# 匹配键：繁体→简体（刮削/库内简繁混用时视为相同）
zhconv = "0.4"
# 汉字拼音排序键（管理表/歌曲列表按曲名等排序）
pinyin = "0.10"

# 任务栏缩略图工具栏（ITaskbarList3 播放控制按钮）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# 资源管理器右键菜单（HKCU 写入，无需管理员）
winreg = "0.55"

[profile.release]
opt-level = 1          # 默认 3,降到 1 编译快一倍+,exe 稍大几 MB 但运行无感
lto = false            # 默认 "thin",关掉省大量链接时间
codegen-units = 16     # 保持并行编译
strip = true           # 去调试符号,减小 exe 体积
